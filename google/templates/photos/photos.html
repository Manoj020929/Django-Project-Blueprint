
<!DOCTYPE html>
<html>
<head>
    <title>Google Photos Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafd;
        }

        /* Header */
        .header {
            height: 80px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            gap: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 220px;
        }

        .logo img {
            width: 35px;
        }

        .logo h2 {
            color: #444;
            font-size: 22px;
            font-weight: normal;
        }

        .search {
            flex: 1;
        }

        .search input {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 30px;
            background-color: #e9eef6;
            font-size: 16px;
            outline: none;
        }

        .profile {
            width: 40px;
            height: 40px;
            background-color: #4285f4;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }

        /* Main Layout */
        .container {
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            text-decoration: none;
            color: #333;
            padding: 15px;
            border-radius: 25px;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .sidebar a:hover {
            background-color: #e5edfa;
        }

        .sidebar .active {
            background-color: #d3e3fd;
            color: #174ea6;
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 25px;
        }

        .main h1 {
            font-size: 28px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        /* Albums */
        .albums {
            display: flex;
            gap: 20px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .album {
            width: 150px;
        }

        .album img {
            width: 150px;
            height: 110px;
            object-fit: cover;
            border-radius: 12px;
        }

        .album p {
            margin-top: 8px;
            font-size: 14px;
        }

        /* Photos */
        .photo-heading {
            font-size: 23px;
            font-weight: normal;
            margin-bottom: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .gallery img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 10px;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .sidebar {
                width: 180px;
            }

            .gallery {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 65px;
                padding: 10px 5px;
            }

            .sidebar a {
                font-size: 0;
                text-align: center;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }

            .header {
                padding: 10px;
                gap: 10px;
            }

            .logo {
                width: auto;
            }

            .logo h2 {
                display: none;
            }

            .main {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">

        <div class="logo">
            <img src="https://www.gstatic.com/images/branding/product/1x/photos_48dp.png">
            <h2>Photos</h2>
        </div>

        <div class="search">
            <input type="text" placeholder="Search your photos">
        </div>

        <div class="profile">M</div>

    </div>

    <div class="container">

        <!-- Sidebar -->
        <div class="sidebar">
            <a href="#" class="active">🏠 Photos</a>
            <a href="#">⭐ Favorites</a>
            <a href="#">📁 Albums</a>
            <a href="#">📦 Archive</a>
            <a href="#">🗑️ Trash</a>
            <a href="#">⚙️ Settings</a>
        </div>

        <!-- Main Content -->
        <div class="main">

            <h1>Welcome to Google Photos</h1>

            <h2 class="photo-heading">Your albums</h2>

            <!-- Albums -->
            <div class="albums">

                <div class="album">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=400">
                    <p>Nature</p>
                </div>

                <div class="album">
                    <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=400">
                    <p>Travel</p>
                </div>

                <div class="album">
                    <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400">
                    <p>Mountains</p>
                </div>

                <div class="album">
                    <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=400">
                    <p>Memories</p>
                </div>

            </div>

            <!-- Photo Gallery -->
            <h2 class="photo-heading">Photos</h2>

            <div class="gallery">

                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=500">
                <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=500">
                <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=500">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500">

                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500">
                <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=500">
                <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=500">

            </div>

        </div>

    </div>

</body>
</html>
